server:
  port: ${PORT:8090}
  address: 0.0.0.0

logging:
  level:
    org.hibernate: info
    org.springframework.security: info

spring:
  application:
    name: mijery-media

  config:
    import: optional:classpath:.env.properties

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:mijery_media}
    username: ${DB_USER:postgres}
    password: ${DB_PWD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    show-sql: false

mijery:
  media:
    storage-dir: ${MIJERY_MEDIA_STORAGE_DIR:./media-storage}
    logo-dir: ${MIJERY_MEDIA_LOGO_DIR:./logo-storage}
    vips-bin: ${MIJERY_MEDIA_VIPS_BIN:vips}
    signing-secret: ${MIJERY_MEDIA_SIGNING_SECRET:change-me-in-production}
    signed-url-ttl: ${MIJERY_MEDIA_SIGNED_URL_TTL:600}
    variant-widths: ${MIJERY_MEDIA_VARIANT_WIDTHS:320,640,1080,1600}
    max-upload-bytes: ${MIJERY_MEDIA_MAX_UPLOAD_BYTES:10485760}
    allowed-mime-types: ${MIJERY_MEDIA_ALLOWED_MIME_TYPES:image/jpeg,image/png,image/webp,image/gif}
    max-logo-bytes: ${MIJERY_MEDIA_MAX_LOGO_BYTES:2097152}
    service-token: ${MIJERY_MEDIA_SERVICE_TOKEN:}
    watermark-opacity: ${MIJERY_MEDIA_WATERMARK_OPACITY:35}
