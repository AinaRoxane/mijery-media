# Nginx configuration for mijery-media
# Place in /etc/nginx/conf.d/ or include in main config.

# Internal location for X-Accel-Redirect (when use-x-accel-redirect=true)
location /media-internal/ {
    internal;
    alias /var/lib/mijery-media/media-storage/variants/;
}

# Public media serving with caching
location /media/ {
    # Verify signed URLs for protected assets (secure_link)
    # secure_link $arg_md5,$arg_expires;
    # secure_link_md5 "$uri$arg_expires change-me-in-production";

    # if ($secure_link = "") {
    #     return 403;
    # }
    # if ($secure_link = "0") {
    #     return 410;  # expired
    # }

    # Proxy to mijery-media for metadata + cache headers
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # Cache public assets at Nginx level
    proxy_cache_valid 200 1y;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# Rate limiting for upload endpoint
location /api/assets {
    limit_req zone=media_upload burst=5 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 15m;
}
